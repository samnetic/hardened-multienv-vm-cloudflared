# =================================================================
# Validate (static checks)
# =================================================================
# Purpose: catch obvious regressions before they hit a VPS.
#
# This intentionally avoids heavyweight scanners and focuses on:
# - bash syntax
# - YAML parseability
# - Python bytecode compile
# =================================================================

name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck

      - name: Shellcheck (hard requirement)
        run: |
          set -euo pipefail
          echo "==> shellcheck: top-level scripts"
          shellcheck -x setup.sh bootstrap.sh

          echo "==> shellcheck: scripts/"
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x

          echo "==> shellcheck: config/bin shell wrappers"
          for f in config/bin/hosting-ci-ssh config/bin/hosting-cloudflared-upgrade; do
            if [ -f "$f" ]; then
              shellcheck -x "$f"
            fi
          done
          echo "shellcheck: all passed"

      - name: Run static validation
        run: |
          set -euo pipefail
          ./scripts/dev/validate-repo.sh
