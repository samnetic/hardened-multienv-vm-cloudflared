# =================================================================
# Falco Configuration (hosting-blueprint)
# =================================================================
# Container runtime security using modern eBPF probe.
# Outputs JSON for structured log processing.
# Exposes Prometheus metrics on port 8765.
# =================================================================

engine:
  kind: modern_ebpf

# JSON output for structured processing
json_output: true
json_include_output_property: true
json_include_tags_property: true

# Log to stdout (Docker captures this)
stdout_output:
  enabled: true

# Syslog output (optional, for host-level logging)
syslog_output:
  enabled: false

# File output (optional)
file_output:
  enabled: false

# gRPC output (for external consumers)
grpc:
  enabled: false

# Prometheus metrics endpoint
metrics:
  enabled: true
  interval: 15s
  output_rule: true

webserver:
  enabled: true
  listen_port: 8765
  k8s_healthz_endpoint: /healthz

# Log level
log_level: info

# Rule loading order
rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/rules.d

# Buffered outputs (reduce syscall overhead)
buffered_outputs: true

# Watch config for changes
watch_config_files: true

# Syscall event drops (alerting threshold)
syscall_event_drops:
  threshold: 0.1
  actions:
    - log
  rate: 0.03333
  max_burst: 1
