# =================================================================
# Grafana Alloy Log Shipping (Overlay Compose)
# =================================================================
# Ships Docker container logs and host security logs to a remote
# Loki instance. Merge with the base monitoring-agent compose:
#
#   docker compose -f compose.yml -f compose.alloy.yml up -d
#
# Required environment variables (in .env):
#   LOKI_URL=http://10.0.1.3:3100/loki/api/v1/push
#   LOKI_USERNAME=writer
#   LOKI_PASSWORD=changeme
# =================================================================

services:
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.13.2}
    container_name: alloy
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    pids_limit: 100

    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host-logs:ro
      - alloy-data:/var/lib/alloy

    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - LOKI_PASSWORD=${LOKI_PASSWORD:-}

    command:
      - "run"
      - "/etc/alloy/config.alloy"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

    networks:
      - monitoring

volumes:
  alloy-data:

networks:
  monitoring:
    external: true
